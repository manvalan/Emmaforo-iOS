name: EmmaForo
options:
  bundleIdPrefix: com.emmaforo
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  EmmaForo:
    type: application
    platform: iOS
    sources: [EmmaForo]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.emmaforo.remote
      DEVELOPMENT_TEAM: 653SB9GBDR
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: EmmaForo
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: EmmaForo cerca il controller nella rete locale.
      INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Usa Bluetooth per configurare la rete Wi-Fi di EmmaForo.
      INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    dependencies:
      - target: EmmaForoWidget
  EmmaForoWidget:
    type: app-extension
    platform: iOS
    sources: [EmmaForoWidget]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.emmaforo.remote.widget
      DEVELOPMENT_TEAM: 653SB9GBDR
      INFOPLIST_FILE: EmmaForoWidget/Info.plist
