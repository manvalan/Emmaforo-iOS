name: EmmaForo
options:
  bundleIdPrefix: com.emmaforo
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  EmmaForo:
    type: application
    platform: iOS
    sources: [EmmaForo]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.emmaforo.remote
      DEVELOPMENT_TEAM: 653SB9GBDR
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: EmmaForo
      INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Usa Bluetooth per configurare la rete Wi-Fi di EmmaForo.
      INFOPLIST_KEY_NSMicrophoneUsageDescription: Usa il microfono solo dopo che premi Parla, per cambiare colore a voce.
      INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Riconosce rosso, giallo, verde o spento per cambiare colore a voce.
    dependencies:
      - target: EmmaForoWidget
  EmmaForoWidget:
    type: app-extension
    platform: iOS
    sources: [EmmaForoWidget]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.emmaforo.remote.widget
      DEVELOPMENT_TEAM: 653SB9GBDR
      INFOPLIST_FILE: EmmaForoWidget/Info.plist
